<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extraction de factures</title>
<style>
  :root {
    color-scheme: light dark;
    --accent: #2563eb;
    --border: #d0d5dd;
    --bg-drop: #f4f6fb;
  }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 760px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1f2430;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.subtitle { color: #6b7280; margin-top: 0; }
  #dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    background: var(--bg-drop);
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #dropzone.dragover { border-color: var(--accent); background: #eaf1fe; }
  #dropzone p { margin: 4px 0; }
  #dropzone .hint { color: #6b7280; font-size: 0.9rem; }
  #fileInput { display: none; }
  #fileList { margin-top: 16px; list-style: none; padding: 0; }
  #fileList li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 6px; font-size: 0.9rem;
  }
  #fileList li button {
    border: none; background: none; color: #b42318; cursor: pointer; font-size: 0.9rem;
  }
  #actions { margin-top: 20px; display: flex; align-items: center; gap: 12px; }
  button#processBtn {
    background: var(--accent); color: white; border: none; padding: 10px 20px;
    border-radius: 8px; font-size: 1rem; cursor: pointer;
  }
  button#processBtn:disabled { background: #9ca3af; cursor: not-allowed; }
  #status { font-size: 0.9rem; color: #6b7280; }
  #error { color: #b42318; margin-top: 10px; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>Extraction de factures</h1>
  <p class="subtitle">Depose tes factures (PDF ou photos) ci-dessous, puis telecharge le recapitulatif Excel.</p>

  <div id="dropzone">
    <p><strong>Glisse-depose tes fichiers ici</strong></p>
    <p class="hint">ou clique pour parcourir — PDF, JPG, PNG</p>
  </div>
  <input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.webp">

  <ul id="fileList"></ul>

  <div id="actions">
    <button id="processBtn" disabled>Extraire et generer l'Excel</button>
    <span id="status"></span>
  </div>
  <div id="error"></div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileListEl = document.getElementById('fileList');
const processBtn = document.getElementById('processBtn');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');

let files = [];

function renderList() {
  fileListEl.innerHTML = '';
  files.forEach((file, idx) => {
    const li = document.createElement('li');
    li.innerHTML = `<span>${file.name}</span>`;
    const btn = document.createElement('button');
    btn.textContent = 'Retirer';
    btn.onclick = () => { files.splice(idx, 1); renderList(); };
    li.appendChild(btn);
    fileListEl.appendChild(li);
  });
  processBtn.disabled = files.length === 0;
}

function addFiles(newFiles) {
  for (const f of newFiles) files.push(f);
  renderList();
}

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => { addFiles(e.target.files); fileInput.value = ''; });

['dragenter', 'dragover'].forEach(evt =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); })
);
['dragleave', 'drop'].forEach(evt =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); })
);
dropzone.addEventListener('drop', (e) => { addFiles(e.dataTransfer.files); });

processBtn.addEventListener('click', async () => {
  errorEl.textContent = '';
  processBtn.disabled = true;
  statusEl.textContent = `Traitement de ${files.length} fichier(s) en cours...`;

  const formData = new FormData();
  for (const f of files) formData.append('files', f);

  try {
    const resp = await fetch('/process', { method: 'POST', body: formData });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ error: 'Erreur inconnue' }));
      throw new Error(err.error || `Erreur serveur (${resp.status})`);
    }
    const blob = await resp.blob();
    const disposition = resp.headers.get('Content-Disposition') || '';
    const match = disposition.match(/filename="?([^"]+)"?/);
    const filename = match ? match[1] : 'factures.xlsx';

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);

    statusEl.textContent = 'Termine — fichier telecharge.';
    files = []; renderList();
  } catch (e) {
    errorEl.textContent = e.message;
    statusEl.textContent = '';
  } finally {
    processBtn.disabled = files.length === 0;
  }
});
</script>
</body>
</html>
