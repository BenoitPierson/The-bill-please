<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premiere configuration — {{ tenant_name }}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="centered">
<form class="card auth-card" method="post" action="/setup">
  <h1 class="auth-title">{{ tenant_name }}</h1>
  <p class="auth-subtitle">
    Aucun compte n'existe encore sur cet espace. Cree le premier utilisateur pour commencer.
  </p>

  {% if error %}<p class="alert alert-error">{{ error }}</p>{% endif %}

  <label class="field">
    <span>Adresse e-mail</span>
    <input type="email" name="email" autocomplete="username" required autofocus>
  </label>

  <label class="field">
    <span>Mot de passe</span>
    <input type="password" name="password" autocomplete="new-password" required minlength="10">
    <small class="hint">10 caracteres minimum.</small>
  </label>

  <button type="submit" class="btn btn-primary btn-block">Creer le compte</button>
</form>
</body>
</html>
